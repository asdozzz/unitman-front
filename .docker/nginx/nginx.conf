# Шаблон nginx для раздачи собранного SPA.
#
# ${CSP_CONNECT_SRC} подставляется entry.sh через envsubst: это origin API и
# Centrifugo (через пробел), вычисленные из VITE_API_HOST /
# VITE_CENTRIFUGE_HOST либо заданные явно. `'self'` добавляется отдельно,
# поэтому same-origin развёртывание не требует настройки.
#
# CSP совместим с Quasar: inline-стили разрешены ('unsafe-inline' только для
# style-src), 'unsafe-eval' отсутствует. Google Fonts из index.html разрешены
# точечно в style-src/font-src.
server {
     listen 80;
     server_name localhost;
     root /usr/share/nginx/html;
     index index.html index.htm;

     add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
     add_header X-Content-Type-Options "nosniff" always;
     add_header Referrer-Policy "no-referrer" always;

     # Конфигурация окружения перезаписывается при старте контейнера.
     # Без no-store браузер может использовать старые хосты после рестарта.
     location = /env-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
     }

     # MIME манифеста не во всех версиях nginx есть в mime.types.
     location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
     }

     location / {
        try_files $uri $uri/ /index.html;
        client_max_body_size 100M;
     }
}
