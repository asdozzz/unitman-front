services:
  app:
    build: 
      context: .
      args:
        ARG_API_HOST: ${UNITMAN_ARG_API_HOST}
        ARG_CENTRIFUGE_HOST: ${UNITMAN_ARG_CENTRIFUGE_HOST}
    environment:
      # Runtime-значения для env-config.js: переопределяют build-arg
      # без пересборки образа.
      VITE_API_HOST: ${UNITMAN_ARG_API_HOST}
      VITE_CENTRIFUGE_HOST: ${UNITMAN_ARG_CENTRIFUGE_HOST}
    ports:
      - 8033:80
